services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: nawall
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    volumes:
      - nawall-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  backend:
    build: ./backend
    env_file: ./backend/.env
    volumes:
      - nawall-uploads:/app/uploads
    environment:
      DB_URL: jdbc:mysql://db:3306/nawall
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8088}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:8088}
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "8088:80"
    depends_on:
      - backend
volumes:
  nawall-db:
  nawall-uploads:
